<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drift Chase 3D</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #hud {
        position: absolute;
        top: 20px;
        left: 20px;
        display: flex;
        gap: 16px;
        z-index: 10;
        font-family: 'Courier New', monospace;
      }

      .panel {
        background: rgba(10, 19, 29, 0.85);
        border: 2px solid rgba(116, 212, 255, 0.4);
        border-radius: 8px;
        padding: 12px 18px;
        min-width: 160px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(10px);
      }

      .panel.small {
        min-width: 120px;
      }

      .label {
        font-size: 10px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        opacity: 0.7;
        color: #74d4ff;
        margin-bottom: 6px;
      }

      #speed, #drift {
        font-size: 28px;
        font-weight: 900;
        color: #74d4ff;
        text-shadow: 0 0 20px rgba(116, 212, 255, 0.8);
      }

      #controls {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        padding: 14px 20px;
        background: rgba(10, 19, 29, 0.8);
        border: 2px solid rgba(116, 212, 255, 0.3);
        border-radius: 8px;
        z-index: 10;
        backdrop-filter: blur(10px);
      }

      #controls span {
        background: rgba(116, 212, 255, 0.1);
        border: 1px solid rgba(116, 212, 255, 0.4);
        color: #74d4ff;
        padding: 6px 12px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.05em;
      }

      #timer {
        position: absolute;
        top: 20px;
        right: 20px;
        background: rgba(10, 19, 29, 0.85);
        border: 2px solid rgba(116, 212, 255, 0.4);
        border-radius: 8px;
        padding: 12px 18px;
        font-family: 'Courier New', monospace;
        min-width: 140px;
        text-align: center;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(10px);
        z-index: 10;
      }

      .timer-label {
        font-size: 10px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        opacity: 0.7;
        color: #74d4ff;
        margin-bottom: 6px;
      }

      #time {
        font-size: 28px;
        font-weight: 900;
        color: #74d4ff;
        text-shadow: 0 0 20px rgba(116, 212, 255, 0.8);
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <div class="panel">
        <div class="label">VELOCIDAD</div>
        <div id="speed">0 km/h</div>
      </div>
      <div class="panel small">
        <div class="label">DERRAPE</div>
        <div id="drift">0%</div>
      </div>
    </div>

    <div id="timer">
      <div class="timer-label">TIEMPO</div>
      <div id="time">0:00</div>
    </div>

    <div id="controls">
      <span>W / ↑ acelerar</span>
      <span>S / ↓ frenar</span>
      <span>A / ← D / → girar</span>
      <span>ESPACIO derrape</span>
    </div>

    <script type="module" src="./game.js"></script>
  </body>
</html>
