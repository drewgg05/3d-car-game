<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drift Chase 3D - Arcade Racing</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
        font-family: 'Orbitron', 'Courier New', monospace;
        color: #00ff88;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* MENU PRINCIPAL */
      #mainMenu {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #0f1729 0%, #1a2642 50%, #0f1729 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        backdrop-filter: blur(10px);
      }

      #mainMenu.hidden {
        display: none;
      }

      .menu-container {
        text-align: center;
        animation: fadeIn 0.8s ease-in;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .game-title {
        font-size: 72px;
        font-weight: 900;
        background: linear-gradient(45deg, #00ff88, #00d9ff, #7700ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
        margin-bottom: 10px;
        letter-spacing: 3px;
      }

      .game-subtitle {
        font-size: 18px;
        color: #00d9ff;
        letter-spacing: 2px;
        margin-bottom: 60px;
        opacity: 0.9;
      }

      .menu-buttons {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-bottom: 60px;
      }

      .menu-btn {
        padding: 18px 50px;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 1.5px;
        border: 2px solid #00ff88;
        background: rgba(0, 255, 136, 0.1);
        color: #00ff88;
        cursor: pointer;
        border-radius: 5px;
        transition: all 0.3s ease;
        text-transform: uppercase;
        box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
      }

      .menu-btn:hover {
        background: #00ff88;
        color: #0f1729;
        box-shadow: 0 0 40px rgba(0, 255, 136, 0.8);
        transform: scale(1.05);
      }

      .menu-info {
        font-size: 14px;
        color: #00d9ff;
        opacity: 0.7;
        margin-top: 40px;
        letter-spacing: 1px;
      }

      /* HUD EN JUEGO */
      #hud {
        position: absolute;
        top: 20px;
        left: 20px;
        display: flex;
        gap: 16px;
        z-index: 10;
      }

      .panel {
        background: rgba(15, 23, 41, 0.9);
        border: 2px solid #00ff88;
        border-radius: 5px;
        padding: 14px 20px;
        min-width: 160px;
        box-shadow: 0 0 20px rgba(0, 255, 136, 0.4), inset 0 0 10px rgba(0, 255, 136, 0.1);
        backdrop-filter: blur(10px);
      }

      .panel.small {
        min-width: 120px;
      }

      .label {
        font-size: 10px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        opacity: 0.8;
        color: #00d9ff;
        margin-bottom: 6px;
      }

      #speed, #drift, #nitro {
        font-size: 28px;
        font-weight: 900;
        color: #00ff88;
        text-shadow: 0 0 15px rgba(0, 255, 136, 0.8);
      }

      #nitroBar {
        position: absolute;
        top: 20px;
        right: 20px;
        background: rgba(15, 23, 41, 0.9);
        border: 2px solid #7700ff;
        border-radius: 5px;
        padding: 14px 20px;
        min-width: 200px;
        box-shadow: 0 0 20px rgba(119, 0, 255, 0.4), inset 0 0 10px rgba(119, 0, 255, 0.1);
        backdrop-filter: blur(10px);
        z-index: 10;
      }

      .nitro-label {
        font-size: 10px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        opacity: 0.8;
        color: #7700ff;
        margin-bottom: 8px;
      }

      #nitroFill {
        width: 100%;
        height: 12px;
        background: rgba(119, 0, 255, 0.2);
        border-radius: 3px;
        overflow: hidden;
        border: 1px solid rgba(119, 0, 255, 0.5);
      }

      #nitroProgress {
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, #7700ff, #ff00ff);
        box-shadow: 0 0 15px rgba(255, 0, 255, 0.8);
        transition: width 0.1s ease;
      }

      #timer {
        position: absolute;
        top: 170px;
        right: 20px;
        background: rgba(15, 23, 41, 0.9);
        border: 2px solid #00d9ff;
        border-radius: 5px;
        padding: 14px 20px;
        min-width: 140px;
        text-align: center;
        box-shadow: 0 0 20px rgba(0, 217, 255, 0.4), inset 0 0 10px rgba(0, 217, 255, 0.1);
        backdrop-filter: blur(10px);
        z-index: 10;
      }

      .timer-label {
        font-size: 10px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        opacity: 0.8;
        color: #00d9ff;
        margin-bottom: 6px;
      }

      #time {
        font-size: 28px;
        font-weight: 900;
        color: #00d9ff;
        text-shadow: 0 0 15px rgba(0, 217, 255, 0.8);
      }

      #controls {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding: 14px 20px;
        background: rgba(15, 23, 41, 0.9);
        border: 2px solid #00ff88;
        border-radius: 5px;
        z-index: 10;
        backdrop-filter: blur(10px);
        max-width: 90vw;
        justify-content: center;
      }

      #controls span {
        background: rgba(0, 255, 136, 0.15);
        border: 1px solid rgba(0, 255, 136, 0.5);
        color: #00ff88;
        padding: 6px 12px;
        border-radius: 3px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      #pauseMenu {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(15, 23, 41, 0.95);
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 999;
        backdrop-filter: blur(10px);
      }

      #pauseMenu.visible {
        display: flex;
      }

      .pause-container {
        text-align: center;
        animation: slideDown 0.4s ease-out;
      }

      @keyframes slideDown {
        from { transform: translateY(-50px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }

      .pause-title {
        font-size: 56px;
        font-weight: 900;
        color: #ff00ff;
        letter-spacing: 2px;
        margin-bottom: 40px;
        text-shadow: 0 0 30px rgba(255, 0, 255, 0.6);
      }

      .pause-buttons {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .pause-btn {
        padding: 16px 40px;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 1.2px;
        border: 2px solid #ff00ff;
        background: rgba(255, 0, 255, 0.1);
        color: #ff00ff;
        cursor: pointer;
        border-radius: 5px;
        transition: all 0.3s ease;
        text-transform: uppercase;
        box-shadow: 0 0 20px rgba(255, 0, 255, 0.3);
      }

      .pause-btn:hover {
        background: #ff00ff;
        color: #0f1729;
        box-shadow: 0 0 40px rgba(255, 0, 255, 0.8);
        transform: scale(1.05);
      }

      #gameOver {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(15, 23, 41, 0.95);
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 999;
        backdrop-filter: blur(10px);
      }

      #gameOver.visible {
        display: flex;
      }

      .gameover-container {
        text-align: center;
        animation: slideDown 0.4s ease-out;
      }

      .gameover-title {
        font-size: 56px;
        font-weight: 900;
        background: linear-gradient(45deg, #ff6b00, #ff0000);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: 2px;
        margin-bottom: 20px;
        text-shadow: 0 0 30px rgba(255, 0, 0, 0.6);
      }

      .gameover-stats {
        margin: 30px 0;
        font-size: 18px;
        color: #00d9ff;
        line-height: 2;
      }

      .gameover-stat-label {
        color: #00ff88;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <!-- MENÚ PRINCIPAL -->
    <div id="mainMenu">
      <div class="menu-container">
        <div class="game-title">DRIFT CHASE 3D</div>
        <div class="game-subtitle">ARCADE RACING EXPERIENCE</div>
        <div class="menu-buttons">
          <button class="menu-btn" onclick="startGame()">INICIAR JUEGO</button>
          <button class="menu-btn" onclick="toggleControls()">CONTROLES</button>
        </div>
        <div class="menu-info">
          Domina el arte del derrape y alcanza la velocidad máxima
        </div>
      </div>
    </div>

    <!-- PAUSA -->
    <div id="pauseMenu">
      <div class="pause-container">
        <div class="pause-title">PAUSA</div>
        <div class="pause-buttons">
          <button class="pause-btn" onclick="resumeGame()">REANUDAR</button>
          <button class="pause-btn" onclick="restartGame()">REINICIAR</button>
          <button class="pause-btn" onclick="mainMenu()">MENÚ PRINCIPAL</button>
        </div>
      </div>
    </div>

    <!-- GAME OVER -->
    <div id="gameOver">
      <div class="gameover-container">
        <div class="gameover-title">JUEGO TERMINADO</div>
        <div class="gameover-stats">
          <div><span class="gameover-stat-label">TIEMPO:</span> <span id="finalTime">0:00</span></div>
          <div><span class="gameover-stat-label">VELOCIDAD MÁX:</span> <span id="maxSpeed">0</span> km/h</div>
          <div><span class="gameover-stat-label">DERRAPE MÁXIMO:</span> <span id="maxDrift">0</span>%</div>
        </div>
        <div class="pause-buttons" style="margin-top: 30px;">
          <button class="pause-btn" onclick="restartGame()">JUGAR DE NUEVO</button>
          <button class="pause-btn" onclick="mainMenu()">MENÚ PRINCIPAL</button>
        </div>
      </div>
    </div>

    <!-- HUD DEL JUEGO -->
    <div id="hud">
      <div class="panel">
        <div class="label">VELOCIDAD</div>
        <div id="speed">0 km/h</div>
      </div>
      <div class="panel small">
        <div class="label">DERRAPE</div>
        <div id="drift">0%</div>
      </div>
    </div>

    <div id="nitroBar">
      <div class="nitro-label">NITRO</div>
      <div id="nitroFill">
        <div id="nitroProgress" style="width: 100%;"></div>
      </div>
    </div>

    <div id="timer">
      <div class="timer-label">TIEMPO</div>
      <div id="time">0:00</div>
    </div>

    <div id="controls">
      <span>W / ↑ ACELERAR</span>
      <span>S / ↓ FRENAR</span>
      <span>A / ← D / → GIRAR</span>
      <span>ESPACIO NITRO</span>
      <span>P PAUSA</span>
    </div>

    <script type="module" src="./game.js"></script>
  </body>
</html>
