<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drift Chase 3D - Racing Game</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
        font-family: 'Courier New', monospace;
        color: #00ff88;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #hud {
        position: absolute;
        top: 20px;
        left: 20px;
        display: flex;
        gap: 16px;
        z-index: 10;
      }

      .panel {
        background: rgba(15, 23, 41, 0.9);
        border: 2px solid #00ff88;
        border-radius: 5px;
        padding: 14px 20px;
        min-width: 160px;
        box-shadow: 0 0 20px rgba(0, 255, 136, 0.4), inset 0 0 10px rgba(0, 255, 136, 0.1);
        backdrop-filter: blur(10px);
      }

      .label {
        font-size: 10px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        opacity: 0.8;
        color: #00d9ff;
        margin-bottom: 6px;
      }

      #cameraInfo {
        font-size: 12px;
        color: #00ff88;
        text-shadow: 0 0 15px rgba(0, 255, 136, 0.8);
      }

      #performanceInfo {
        position: absolute;
        top: 20px;
        right: 20px;
        background: rgba(15, 23, 41, 0.9);
        border: 2px solid #00d9ff;
        border-radius: 5px;
        padding: 14px 20px;
        min-width: 150px;
        box-shadow: 0 0 20px rgba(0, 217, 255, 0.4);
        backdrop-filter: blur(10px);
        z-index: 10;
        font-size: 12px;
        color: #00d9ff;
        line-height: 1.6;
      }

      #debugInfo {
        position: absolute;
        bottom: 20px;
        left: 20px;
        background: rgba(15, 23, 41, 0.9);
        border: 2px solid #ffb703;
        border-radius: 5px;
        padding: 14px 20px;
        font-size: 11px;
        color: #ffb703;
        line-height: 1.4;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <div class="panel">
        <div class="label">Cámara</div>
        <div id="cameraInfo">Sistema 3D listo</div>
      </div>
    </div>

    <div id="performanceInfo">
      <div><strong>Rendimiento</strong></div>
      <div id="fps">FPS: --</div>
      <div id="drawCalls">Draw Calls: --</div>
      <div id="objects">Objetos: --</div>
    </div>

    <div id="debugInfo">
      <div id="sceneStats">Escena: Cargando...</div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
